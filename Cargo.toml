[package]
name = "marconi"
version = "0.1.0"
edition = "2021"
description = "Reverse:1999 Summon History link grabber"
license = "MIT"

[[bin]]
name = "marconi"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }

[profile.release]
lto = true
strip = true
